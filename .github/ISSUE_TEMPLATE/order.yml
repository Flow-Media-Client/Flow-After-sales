name: 订单与支付问题
description: 已付款未收到激活码、重复扣款、退款申请、订单状态异常
title: "[订单] "
labels: ["order"]
body:
  - type: markdown
    attributes:
      value: |
        感谢提交售后单。涉及订单与支付的问题请尽量提供凭证,以便核实处理。

        ⚠️ **隐私提示**:支付截图请隐去手机号、住址、银行卡号等敏感信息。

  - type: dropdown
    id: issue-type
    attributes:
      label: 问题类型
      options:
        - 已付款但没收到激活码
        - 重复扣款
        - 退款申请
        - 订单状态异常(显示未支付 / 处理中)
        - 其它
    validations:
      required: true

  - type: input
    id: order-id
    attributes:
      label: 订单号
      placeholder: 例:202605210001234
    validations:
      required: true

  - type: input
    id: pay-method
    attributes:
      label: 支付方式
      placeholder: 例:微信支付 / 支付宝 / 其它
    validations:
      required: true

  - type: input
    id: pay-time
    attributes:
      label: 支付时间
      placeholder: 例:2026-05-21 14:32
    validations:
      required: true

  - type: input
    id: amount
    attributes:
      label: 支付金额
      placeholder: 例:¥99
    validations:
      required: true

  - type: textarea
    id: detail
    attributes:
      label: 详细描述
      placeholder: |
        说明你遇到的情况:
        - 多久没收到激活码?
        - 扣了几次款?分别是什么时间?
        - 退款原因是什么?
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: 凭证截图(可选)
      description: 把图片直接拖到此输入框,会自动上传
      placeholder: 拖入支付凭证、订单截图等(请隐去敏感信息)

  - type: input
    id: contact
    attributes:
      label: 联系邮箱
      description: 涉及退款 / 重发激活码时使用
      placeholder: 例:you@example.com
    validations:
      required: true

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我的订单来自 https://pay.ldxp.cn/shop/ririsstore
          required: true
        - label: 我已隐去支付凭证中的敏感信息
          required: true
